<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App - Local Storage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <main>
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn">
                        <span class="plus-icon">+</span> Add
                    </button>
                </div>
                <div class="input-options">
                    <select id="filterSelect" class="filter-select">
                        <option value="all">All Tasks</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Active</span>
                    <span class="stat-value active" id="activeCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value completed" id="completedCount">0</span>
                </div>
            </section>

            <!-- Todo List Section -->
            <section class="todos-section">
                <ul id="todoList" class="todo-list">
                    <!-- Todos will be added here by JavaScript -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <p>📭 No tasks yet. Add one to get started!</p>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="action-buttons">
                <button id="clearCompletedBtn" class="btn btn-secondary" style="display: none;">
                    🗑️ Clear Completed
                </button>
                <button id="clearAllBtn" class="btn btn-danger" style="display: none;">
                    ⚠️ Clear All
                </button>
            </section>
        </main>

        <footer>
            <p>💡 Your tasks are automatically saved to local storage</p>
            <p class="version">v1.0 - Todo App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
